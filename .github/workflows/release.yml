name: Release

# A tag vX.Y.Z publishes a release that both registries read. The signing key lives in the protected `Terraform`
# environment (secrets GPG_PRIVATE_KEY and PASSPHRASE): its public half is the one given to the registries.
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, never cancelled halfway: two tags pushed together publish one after the other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    environment: Terraform
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release and its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Built from the module proxy, not from a cache another run wrote: these binaries are signed.
          cache: false
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
